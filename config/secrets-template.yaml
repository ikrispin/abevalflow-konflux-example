# Secrets required for the Lightspeed Agent ABEvalFlow example
#
# Apply these to your Konflux tenant namespace before running the pipeline.
---
# workload-cluster-credentials
# Required for cross-cluster agent deployment and remote eval mode.
# Create the SA and token on the workload cluster:
#   oc create sa abevalflow-deployer -n ab-eval-flow
#   oc adm policy add-role-to-user edit -z abevalflow-deployer -n ab-eval-flow
#   oc create token abevalflow-deployer -n ab-eval-flow --duration=8760h
apiVersion: v1
kind: Secret
metadata:
  name: workload-cluster-credentials
  namespace: ai5-marketplace-tenant
type: Opaque
stringData:
  token: "<REPLACE_WITH_WORKLOAD_CLUSTER_SA_TOKEN>"
---
# llm-credentials
# API key for the LLM proxy. When using LiteLLM proxy, set to "sk-dummy".
apiVersion: v1
kind: Secret
metadata:
  name: llm-credentials
  namespace: ai5-marketplace-tenant
type: Opaque
stringData:
  api-key: "sk-dummy"
