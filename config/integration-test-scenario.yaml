# IntegrationTestScenario for Google Lightspeed Agent
#
# Apply this to your Konflux tenant namespace to enable ABEvalFlow evaluation
# as an integration test for the google-lightspeed-agent application.
#
# This ITS references the example pipeline in this repo, which includes
# Lightspeed-specific deploy/cleanup tasks wrapping ABEvalFlow's core tasks.
apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  name: abevalflow-eval
  namespace: ai5-marketplace-tenant
  labels:
    test.appstudio.openshift.io/optional: "true"
spec:
  application: google-lightspeed-agent
  contexts:
    - description: AI agent evaluation via ABEvalFlow
      name: application
  resolverRef:
    resolver: git
    resourceKind: pipelinerun
    params:
      - name: url
        value: https://github.com/ikrispin/abevalflow-konflux-example
      - name: revision
        value: main
      - name: pathInRepo
        value: pipeline/pipeline.yaml
