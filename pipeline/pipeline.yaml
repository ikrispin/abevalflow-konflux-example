# Google Lightspeed Agent — Full ABEvalFlow Evaluation Pipeline
#
# This PipelineRun demonstrates how to compose ABEvalFlow's generic evaluation
# tasks with application-specific deploy/cleanup tasks. It:
#   1. Parses the Konflux Snapshot to extract the built agent image
#   2. Deploys the Lightspeed agent on a workload cluster (app-specific)
#   3. Runs ABEvalFlow's core evaluation: prepare → test → evaluate → analyze → store → emit
#   4. Cleans up the agent deployment (finally block)
#
# To adapt for your application:
#   - Replace deploy-agent and cleanup-agent with your own tasks
#   - Update the parameters (submission, endpoints, etc.)
#   - Keep the ABEvalFlow core tasks (Tekton Bundles) as-is
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: lightspeed-abevalflow-eval
spec:
  timeouts:
    pipeline: "4h"
    tasks: "3h"
  pipelineSpec:
    params:
      - name: SNAPSHOT
        type: string
        description: Konflux Snapshot JSON with component details
      - name: AGENT_IMAGE_OVERRIDE
        type: string
        default: "quay.io/ecosystem-appeng/google-lightspeed-agent:176a268e"
        description: >-
          Override the agent image instead of using the one from the Konflux
          snapshot. Set this when the snapshot image is in a private registry
          that the workload cluster cannot pull from. Set to empty string to
          use the Snapshot image directly.
    workspaces:
      - name: shared-workspace
    results:
      - name: TEST_OUTPUT
        description: Standardized Konflux test output
        value: $(tasks.emit-result.results.TEST_OUTPUT)
    tasks:
      # ================================================================
      # Stage 1: Parse the Konflux Snapshot (ABEvalFlow core task)
      # ================================================================
      - name: parse-snapshot
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: parse-snapshot
            - name: bundle
              value: quay.io/rh-ee-ikrispin/abevalflow-task-parse-snapshot:0.1
            - name: kind
              value: task
        params:
          - name: SNAPSHOT
            value: $(params.SNAPSHOT)

      # ================================================================
      # Stage 2: Deploy agent (APPLICATION-SPECIFIC)
      # Replace this task with your own deployment logic.
      # ================================================================
      - name: deploy-agent
        runAfter: [parse-snapshot]
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/ikrispin/abevalflow-konflux-example
            - name: revision
              value: main
            - name: pathInRepo
              value: pipeline/deploy-agent.yaml
        params:
          - name: agent-image
            value: $(tasks.parse-snapshot.results.component-image)
          - name: agent-image-override
            value: $(params.AGENT_IMAGE_OVERRIDE)
          - name: llm-api-base
            value: "http://litellm.ab-eval-flow.svc:4000"
          - name: llm-model
            value: "gpt-4o"
          - name: pipeline-run-id
            value: $(context.pipelineRun.name)

      # ================================================================
      # Stage 3: Prepare (ABEvalFlow core task)
      # ================================================================
      - name: prepare
        runAfter: [deploy-agent]
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: prepare
            - name: bundle
              value: quay.io/rh-ee-ikrispin/abevalflow-task-prepare:0.1
            - name: kind
              value: task
        params:
          - name: repo-url
            value: https://github.com/ikrispin/abevalflow-konflux-example.git
          - name: revision
            value: main
          - name: submission-dir
            value: google-lightspeed-agent
          - name: eval-engine
            value: a2a
          - name: pipeline-repo-url
            value: https://github.com/RHEcosystemAppEng/ABEvalFlow.git
          - name: pipeline-repo-revision
            value: main
          - name: pipeline-run-name
            value: $(context.pipelineRun.name)
          - name: enable-generation
            value: "false"
        workspaces:
          - name: source
            workspace: shared-workspace

      # ================================================================
      # Stage 4: Test (ABEvalFlow core task)
      # ================================================================
      - name: test
        runAfter: [prepare]
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: test
            - name: bundle
              value: quay.io/rh-ee-ikrispin/abevalflow-task-test:0.1
            - name: kind
              value: task
        params:
          - name: submission-dir
            value: google-lightspeed-agent
          - name: submission-name
            value: $(tasks.prepare.results.submission-name)
          - name: eval-engine
            value: a2a
          - name: report-prefix
            value: $(tasks.prepare.results.report-prefix)
          - name: pipeline-run-name
            value: $(context.pipelineRun.name)
          - name: pipeline-repo-url
            value: https://github.com/RHEcosystemAppEng/ABEvalFlow.git
          - name: pipeline-repo-revision
            value: main
          - name: security-scan-mode
            value: disabled
          - name: submission-security-scan
            value: $(tasks.prepare.results.security-scan)
          - name: submission-skip-quality-review
            value: $(tasks.prepare.results.skip-quality-review)
          - name: enable-quality-review
            value: "false"
          - name: llm-base-url
            value: "http://litellm.ab-eval-flow.svc:4000/v1"
        workspaces:
          - name: source
            workspace: shared-workspace

      # ================================================================
      # Stage 5: Evaluate (ABEvalFlow core task)
      # Note: uses "remote" mode to run eval on the workload cluster
      # where the agent is deployed.
      # ================================================================
      - name: evaluate
        runAfter: [test]
        timeout: "3h"
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: evaluate
            - name: bundle
              value: quay.io/rh-ee-ikrispin/abevalflow-task-evaluate:0.1
            - name: kind
              value: task
        params:
          - name: eval-engine
            value: a2a
          - name: submission-dir
            value: google-lightspeed-agent
          - name: submission-name
            value: $(tasks.prepare.results.submission-name)
          - name: commit-sha
            value: $(tasks.parse-snapshot.results.git-revision)
          - name: pipeline-run-id
            value: $(context.pipelineRun.name)
          - name: pipeline-repo-url
            value: https://github.com/RHEcosystemAppEng/ABEvalFlow.git
          - name: pipeline-repo-revision
            value: main
          - name: llm-model
            value: "claude-sonnet"
          - name: llm-api-base
            value: "http://litellm.ab-eval-flow.svc:4000"
          - name: agent-endpoint
            value: $(tasks.deploy-agent.results.agent-endpoint)
          - name: eval-mode
            value: "remote"
          - name: workload-cluster-url
            value: "https://api.cn-ai-lab.2vn8.p1.openshiftapps.com:6443"
          - name: workload-namespace
            value: "ab-eval-flow"
        workspaces:
          - name: source
            workspace: shared-workspace

      # ================================================================
      # Stage 6: Analyze + Scorecard (ABEvalFlow core task)
      # ================================================================
      - name: analyze-scorecard
        runAfter: [evaluate]
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: analyze-scorecard
            - name: bundle
              value: quay.io/rh-ee-ikrispin/abevalflow-task-analyze-scorecard:0.1
            - name: kind
              value: task
        params:
          - name: submission-name
            value: $(tasks.prepare.results.submission-name)
          - name: eval-engine
            value: a2a
          - name: commit-sha
            value: $(tasks.parse-snapshot.results.git-revision)
          - name: pipeline-run-id
            value: $(context.pipelineRun.name)
          - name: uplift-threshold
            value: "0.0"
          - name: pipeline-repo-url
            value: https://github.com/RHEcosystemAppEng/ABEvalFlow.git
          - name: pipeline-repo-revision
            value: main
          - name: enable-scorecard
            value: "true"
          - name: enable-degradation-check
            value: "false"
        workspaces:
          - name: source
            workspace: shared-workspace

      # ================================================================
      # Stage 7: Store (ABEvalFlow core task)
      # ================================================================
      - name: store
        runAfter: [analyze-scorecard]
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: store
            - name: bundle
              value: quay.io/rh-ee-ikrispin/abevalflow-task-store:0.1
            - name: kind
              value: task
        params:
          - name: submission-name
            value: $(tasks.prepare.results.submission-name)
          - name: pipeline-run-id
            value: $(context.pipelineRun.name)
          - name: report-prefix
            value: $(tasks.prepare.results.report-prefix)
          - name: recommendation
            value: $(tasks.evaluate.results.recommendation)
          - name: eval-engine
            value: a2a
          - name: commit-sha
            value: $(tasks.parse-snapshot.results.git-revision)
          - name: pipeline-repo-url
            value: https://github.com/RHEcosystemAppEng/ABEvalFlow.git
          - name: pipeline-repo-revision
            value: main
        workspaces:
          - name: source
            workspace: shared-workspace

      # ================================================================
      # Stage 8: Emit Konflux TEST_OUTPUT (ABEvalFlow core task)
      # ================================================================
      - name: emit-result
        runAfter: [store]
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: emit-result
            - name: bundle
              value: quay.io/rh-ee-ikrispin/abevalflow-task-emit-result:0.1
            - name: kind
              value: task
        params:
          - name: submission-name
            value: $(tasks.prepare.results.submission-name)
        workspaces:
          - name: source
            workspace: shared-workspace

    # ==================================================================
    # FINALLY: Cleanup agent deployment (APPLICATION-SPECIFIC)
    # ==================================================================
    finally:
      - name: cleanup-agent
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/ikrispin/abevalflow-konflux-example
            - name: revision
              value: main
            - name: pathInRepo
              value: pipeline/cleanup-agent.yaml
        params:
          - name: agent-name
            value: $(tasks.deploy-agent.results.agent-name)
          - name: deployed
            value: $(tasks.deploy-agent.results.deployed)

  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
